name: Deploy la-huella-test

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Run Docker on Self-Hosted Runner
    runs-on: [self-hosted, Linux]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t la-huella-test:latest .

      - name: Stop and remove previous container (if exists)
        run: |
          if [ "$(docker ps -aq -f name=la-huella-test)" ]; then
            docker stop la-huella-test || true
            docker rm la-huella-test || true
          fi

      - name: Run new container
        run: |
          docker run -d \
            --name la-huella-test \
            -p 3000:3000 \
            -e CURRENT_STAGE=1 \
            la-huella-test:latest
